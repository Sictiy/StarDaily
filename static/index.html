<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f3">
  <title>Star Daily · 每日升星榜</title>
  <link rel="icon" type="image/svg+xml" href="./mark.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap top-inner">
    <a class="brand" href="./" aria-label="Star Daily 首页"><img src="./mark.svg" alt="" width="36" height="36"><span>star<span class="brand-light">daily</span></span></a>
    <span class="header-note"><span class="live-dot"></span>每日 08:00 更新</span>
  </div>
</header>
<main class="wrap">
  <section class="board" aria-labelledby="board-title">
    <div class="board-head">
      <div>
        <div class="section-label">DAILY RANKING <span>/ 01 — 20</span></div>
        <h1 id="board-title">每日升星榜<span class="title-dot">.</span></h1>
        <p>每天发现值得关注的开源项目。</p>
      </div>
      <div class="date-control"><label for="edition">榜单日期</label><select id="edition" aria-label="查看榜单日期"><option>暂无数据</option></select></div>
    </div>
    <div class="board-meta"><span>排名 / 项目</span><span>今日升星</span></div>
    <div id="list" aria-live="polite"><div class="empty"><img src="./mark.svg" alt="" width="48" height="48"><h2>榜单还在路上</h2><p>首次采集完成后，榜单会出现在这里。</p></div></div>
    <div class="board-foot"><span><span class="foot-dot"></span><span id="updated">等待首次采集</span></span><span>北京时间 · 08:00</span></div>
    <p class="method">按热门候选项目的今日新增星数排序，并非全站完整排名。</p>
  </section>
</main>
<footer class="wrap footer"><span>STAR DAILY</span><span>每天，发现新项目。</span></footer>
<script src="./app.js"></script>
</body>
</html>
